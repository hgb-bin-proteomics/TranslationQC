[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "qc-bench"
version = "0.1.0"
description = "Add your description here"
keywords = ["example", "template"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Your Name", email = "your.mail@mail.com" },
]
maintainers = [
    { name = "Your Name", email = "your.mail@mail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Development Status :: 5 - Production/Stable"
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.23.0",
    "ollama>=0.6.2",
    "openai>=3.13.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.20.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
qc-bench = "qc_bench:main"

[project.urls]
Homepage = "https://github.com/michabirklbauer/python-pkg_template"
Documentation = "https://github.com/michabirklbauer/python-pkg_template"
Repository = "https://github.com/michabirklbauer/python-pkg_template.git"
Issues = "https://github.com/michabirklbauer/python-pkg_template/issues"
